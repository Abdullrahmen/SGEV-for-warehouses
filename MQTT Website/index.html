<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control</title>
    <style>
        :root {
            --bg-color: #0a192f;       /* Deep Navy Blue */
            --panel-color: #112240;    /* Lighter Navy */
            --accent-color: #64ffda;   /* Neon Cyan */
            --text-color: #ccd6f6;     /* Light Blue-Grey */
            --btn-color: #1d3557;      /* Button Base Blue */
            --btn-shadow: #020c1b;     /* Dark Shadow */
            --danger-color: #cf6679;   /* Red for status */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
        }

        #status-bar {
            margin-bottom: 30px;
            font-size: 0.85rem;
            color: #8892b0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger-color);
            /* Breathing Animation */
            animation: pulse 1.5s infinite ease-in-out;
        }

        #status-dot.connected {
            background-color: var(--accent-color);
            animation: none; /* Stop breathing when connected */
            box-shadow: 0 0 8px var(--accent-color);
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1.0; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.8); }
        }

        /* D-PAD LAYOUT using CSS Grid */
        .dpad-container {
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px;
            gap: 12px; /* Space between buttons */
            justify-content: center;
        }

        .ctrl-btn {
            width: 100%;
            height: 100%;
            border-radius: 15px; /* Rounded corners */
            border: none;
            background-color: var(--btn-color);
            color: var(--text-color);
            font-size: 28px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;

            /* 3D Effect */
            box-shadow: 0 6px 0 var(--btn-shadow), 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }

        /* Grid Positioning */
        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Active/Pressed State */
        .ctrl-btn:active, .ctrl-btn.active {
            background-color: var(--accent-color);
            color: #0a192f;
            box-shadow: 0 2px 0 var(--btn-shadow), 0 5px 10px rgba(0,0,0,0.3);
            transform: translateY(4px); /* Moves button down */
        }

        /* Overlay for Multi-user locking */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #overlay.hidden { display: none; }

        #take-control-btn {
            padding: 15px 30px;
            font-size: 16px;
            background-color: transparent;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: var(--accent-color);
            transition: all 0.2s;
        }

        #take-control-btn:hover {
            background-color: rgba(100, 255, 218, 0.1);
        }

        #lock-info {
            margin-bottom: 20px;
            color: var(--danger-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Lock Overlay -->
    <div id="overlay" class="hidden">
        <div id="lock-info">Controller is busy</div>
        <button id="take-control-btn">Take Control</button>
    </div>

    <h1>Remote Control</h1>
    <div id="status-bar">
        <div id="status-dot"></div>
        <span id="conn-status">Connecting...</span>
    </div>

    <div class="dpad-container">
        <!-- Up -->
        <button id="btn-up" class="ctrl-btn" data-cmd="UP">▲</button>
        <!-- Left -->
        <button id="btn-left" class="ctrl-btn" data-cmd="LEFT">◀</button>
        <!-- Down -->
        <button id="btn-down" class="ctrl-btn" data-cmd="DOWN">▼</button>
        <!-- Right -->
        <button id="btn-right" class="ctrl-btn" data-cmd="RIGHT">▶</button>
    </div>

    <!-- MQTT.js Library (LOCAL FILE) -->
    <!-- Make sure mqtt.min.js is in the same folder as this html file -->
    <script src="./mqtt.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        const MQTT_BROKER_IP = '192.168.1.2'; // REPLACE WITH YOUR LAPTOP IP
        const MQTT_WS_PORT = 9001;
        
        const TOPIC_COMMAND = "robot/command";
        const TOPIC_LOCK = "robot/lock/status";
        
        // --- STATE VARIABLES ---
        let client = null;
        let myClientId = 'web_' + Math.random().toString(16).substr(2, 8);
        let isLockedByOther = false;
        
        const pressedKeys = [];
        let activeCommand = null;
        
        const keyMap = {
            'w': 'UP', 'arrowup': 'UP',
            's': 'DOWN', 'arrowdown': 'DOWN',
            'a': 'LEFT', 'arrowleft': 'LEFT',
            'd': 'RIGHT', 'arrowright': 'RIGHT'
        };

        const cmdToButtonId = {
            'UP': 'btn-up',
            'DOWN': 'btn-down',
            'LEFT': 'btn-left',
            'RIGHT': 'btn-right'
        };

        // --- MQTT CONNECTION ---
        function connectMQTT() {
            const url = `ws://${MQTT_BROKER_IP}:${MQTT_WS_PORT}`;
            
            client = mqtt.connect(url, {
                clientId: myClientId,
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 2000
            });

            client.on('connect', () => {
                document.getElementById('conn-status').innerText = 'Connected';
                document.getElementById('status-dot').classList.add('connected');
                
                client.subscribe(TOPIC_LOCK, { qos: 1 });
                checkLockStatus(); 
            });

            client.on('message', (topic, message) => {
                if (topic === TOPIC_LOCK) {
                    handleLockMessage(message.toString());
                }
            });

            client.on('close', () => {
                document.getElementById('conn-status').innerText = 'Disconnected';
                document.getElementById('status-dot').classList.remove('connected');
            });
        }

        // --- LOCKING LOGIC ---
        function handleLockMessage(payload) {
            if (!payload || payload === '') {
                isLockedByOther = false;
                acquireLock();
            } else {
                const holderId = payload.split(':')[0];
                if (holderId !== myClientId) {
                    isLockedByOther = true;
                    showOverlay(true);
                } else {
                    isLockedByOther = false;
                    showOverlay(false);
                }
            }
        }

        function checkLockStatus() {
            acquireLock();
        }

        function acquireLock() {
            if(client && client.connected) {
                const payload = `${myClientId}:${Date.now()}`;
                client.publish(TOPIC_LOCK, payload, { retain: true, qos: 1 });
            }
        }

        function forceTakeControl() {
            acquireLock();
        }

        function showOverlay(show) {
            document.getElementById('overlay').classList.toggle('hidden', !show);
        }

        // --- CONTROL LOGIC ---

        function sendCommand(cmd) {
            activeCommand = cmd;
            updateButtonVisuals();

            if (isLockedByOther) return;
            if (!client || !client.connected) return;

            client.publish(TOPIC_COMMAND, cmd, { qos: 1 });
            console.log("Sent:", cmd);
        }

        function sendStop() {
            if (activeCommand !== null) {
                 activeCommand = null;
                 updateButtonVisuals();
            }

            if (isLockedByOther) return;
            if (!client || !client.connected) return;

            client.publish(TOPIC_COMMAND, "STOP", { qos: 1 });
            console.log("Sent: STOP");
        }

        function updateButtonVisuals() {
            document.querySelectorAll('.ctrl-btn').forEach(btn => btn.classList.remove('active'));
            if (activeCommand && cmdToButtonId[activeCommand]) {
                document.getElementById(cmdToButtonId[activeCommand]).classList.add('active');
            }
        }

        // --- INPUT HANDLING (Priority Stack) ---

        function handleInputDown(key) {
            const cmd = keyMap[key.toLowerCase()];
            if (!cmd) return;

            if (!pressedKeys.includes(key)) {
                pressedKeys.unshift(key);
                
                // Priority Logic: Only send command if this is the ONLY key pressed (First press)
                // Your requirement: "If holding W and press D, D is ignored"
                // This means we only send a command if the stack was empty (first press).
                
                if (pressedKeys.length === 1) {
                    sendCommand(cmd);
                }
            }
        }

        function handleInputUp(key) {
            const cmd = keyMap[key.toLowerCase()];
            if (!cmd) return;

            const index = pressedKeys.indexOf(key);
            if (index > -1) {
                pressedKeys.splice(index, 1);
                
                sendStop();

                // Requirement: "Only after release W then D gets registered"
                // If the stack still has keys, the NEW top of stack becomes active.
                if (pressedKeys.length > 0) {
                    const newActiveKey = pressedKeys[0];
                    const newCmd = keyMap[newActiveKey.toLowerCase()];
                    sendCommand(newCmd);
                }
            }
        }

        // --- EVENT LISTENERS ---

        // 1. Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            handleInputDown(e.key);
        });

        window.addEventListener('keyup', (e) => {
            handleInputUp(e.key);
        });

        // 2. Mouse / Touch
        document.querySelectorAll('.ctrl-btn').forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');
            const keyName = Object.keys(keyMap).find(k => keyMap[k] === cmd);

            btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleInputDown(keyName); });
            btn.addEventListener('mouseup', (e) => { handleInputUp(keyName); });
            btn.addEventListener('mouseleave', (e) => { 
                if(pressedKeys.includes(keyName)) handleInputUp(keyName); 
            });

            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                handleInputDown(keyName); 
            });
            btn.addEventListener('touchend', (e) => { 
                e.preventDefault();
                handleInputUp(keyName); 
            });
        });

        // 3. Take Control
        document.getElementById('take-control-btn').addEventListener('click', () => {
            forceTakeControl();
        });

        // --- START ---
        connectMQTT();

    </script>
</body>
</html>
