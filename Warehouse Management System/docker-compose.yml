services:
  ros2:
    build:
      context: ./ros2_ws
      dockerfile: Dockerfile
    environment:
      - MQTT_HOST=mosquitto
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_SIM_RENDER_ENGINE=ogre2
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
    depends_on:
      - mosquitto
    runtime: nvidia
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/.mutter-Xwaylandauth.XP4WQ3}:/tmp/.Xauthority:ro
    command: ros2 launch robot_simulation simulation.launch.py headless:=${GAZEBO_HEADLESS:-True}

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:


